[package]
name = "mcp-prism"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust MCP aggregation pool with proxy-aware routing and optional small-model planning."

[lib]
name = "mcp_prism"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "http1", "http2", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
prometheus-client = "0.23"
rand = "0.9"
redis = { version = "0.32", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "socks"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.48", features = ["full", "test-util"] }
tower = "0.5"
